apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-jdb-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "JDBTF",
        "IntervalMinute": 3,
        "IntervalMinutesMax": 5,
        "IntervalMinutesMinimum": 1,
        "LockMinute": 2
      },
      "GameRecord": {
         "GameCommandClientBaseUrl": "http://game-gamecommand/",
         "GameInterfaceJDBBaseUrl": "http://game-gameinterface-jdb-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
